<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
    
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/card.css">
</head>
<body>
    <div class="product-card">
        <div class="card-top">
            <img src="picture/cup.png" alt="" class="card-top__image">
            <span class="product-card__form">FORM</span>
            <div class="product-card__favourites"></div>
            <div class="product-card__collection-badge">THE DAILY ESSENTIALS</div>
        </div>
        <div class="product-card__content">
            <div class="product-card__header">
                <span class="product-card__category">MADE FOR YOUR EVERYDAY</span>
                <span class="rating">4.9 (128)</span>
            </div>
            <div class="product-card__info-product">
                <span class="product-card__name">
                    Everyday tumbler
                </span>
                <span class="product-card__price">
                    $38
                </span>
            </div>
            <div class="regular-text">
                A little ritual, made to go. Thoughtfully insulated to keep your coffee just the way you like it.
            </div>
            <div class="product-property">
                <div class="product-property__color">
                    <div class="product-property__label">
                        <span class="product-property__title">Color</span>
                        <span class="product-property__value">Clay</span>
                    </div>
                    <div class="product-property__swatches">
                        <span class="swatch swatch--active" style="background-color: #A87B63;"></span>
                        <span class="swatch" style="background-color: #C9B99A;"></span>
                        <span class="swatch" style="background-color: #3D3D3D;"></span>
                    </div>
                </div> 
                <div class="product-property__capacity">
                    <span class="product-property__description" >350 ml / 12 oz</span>
                    <span class="product-property__point">•</span>
                    <span class="product-property__description">Hot for 6 hours</span>
                    <span class="product-property__point">•</span>
                    <span class="product-property__description">Stainless steel</span>
                </div>
            </div>
            <button class="add-to-bag">
                <div class="add-to-bag__icon"></div>
                <span class="add-to-bag__text">Add to bag — $38</span>
                <div class="add-to-bag__arrow"></div>
            </button>
            <div class="product-card__status">
                <span class="product-card__point"></span>
                <span class="product-card__text">In stock · Ships in 1-2 business days</span>
            </div>
        </div>
    </div>
</body>
</html>
